<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nanterre Université —</title>

<style>

:root{
    --red:#d72f27;
    --black:#111;
    --white:#fff;
    --grey:#f4f4f4;
    --border:#ddd;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    

.demo-banner{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:9999;

    background:#111;
    color:#fff;

    text-align:center;

    padding:7px 10px;

    font-size:12px;
    font-weight:800;
    letter-spacing:.3px;
}

/* =========================
   HEADER
========================= */

.header{
    margin-top:30px;

    min-height:105px;

    padding:18px 28px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:50px;
    height:50px;
    position:relative;
}

.logo:before{
    content:"";

    position:absolute;

    left:0;
    top:2px;

    width:28px;
    height:45px;

    background:var(--red);

    clip-path:polygon(
        0 0,
        100% 0,
        100% 54%,
        57% 54%,
        57% 100%,
        0 68%
    );
}

.logo:after{
    content:"";

    position:absolute;

    left:30px;
    bottom:0;

    width:13px;
    height:13px;

    border-radius:50%;

    background:var(--red);
}

.brand-title{
    font-size:21px;
    font-weight:800;
    line-height:1;
}

.brand-title span{
    display:block;
}

.brand-sub{
    margin-top:6px;

    color:#555;

    font-size:10px;
    font-weight:700;
}

.menu{
    border:0;
    background:transparent;

    color:#111;

    font-size:34px;
    font-weight:900;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:350px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
    overflow:hidden;

    padding:45px 20px;
}

.hero:before{
    content:"";

    position:absolute;

    inset:-50px;

    opacity:.58;

    background-image:
        linear-gradient(
            45deg,
            transparent 45%,
            #cfcfcf 46%,
            #cfcfcf 49%,
            transparent 50%
        ),
        linear-gradient(
            -45deg,
            transparent 45%,
            #cfcfcf 46%,
            #cfcfcf 49%,
            transparent 50%
        );

    background-size:90px 90px;
}

.hero h1{
    position:relative;

    margin:0;

    color:var(--red);

    font-size:clamp(45px,8vw,76px);

    line-height:.98;

    font-weight:800;
}

/* =========================
   NAVIGATION
========================= */

.tabs{
    max-width:900px;

    margin:auto;

    display:flex;

    border-bottom:2px solid #111;
}

.tab{
    flex:1;

    border:0;

    background:#fff;

    color:#111;

    padding:18px 5px;

    font-size:21px;

    border-bottom:7px solid transparent;
}

.tab.active{
    color:var(--red);

    border-bottom-color:var(--red);
}

/* =========================
   CONTENU
========================= */

main{
    padding:34px 6vw 70px;
}

.page{
    display:none;

    max-width:900px;

    margin:auto;
}

.page.active{
    display:block;
}

/* =========================
   CARTES
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:25px;

    max-width:900px;

    margin:auto;
}

.card{
    min-height:270px;

    border:7px solid var(--red);

    border-radius:44px;

    background:#fff;

    color:#111;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

    appearance:none;

    transition:.15s;
}

.card:hover{
    transform:translateY(-2px);
}

.card h2{
    color:#111;

    font-size:37px;

    font-weight:400;

    margin:18px 0 12px;
}

.card p{
    color:#111;

    font-size:20px;

    margin:0;
}

/* =========================
   ICONES
========================= */

.icon{
    width:70px;
    height:70px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.icon svg{
    width:62px;
    height:62px;

    stroke:#111;

    fill:none;

    stroke-width:2.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   PAGE INTERNE
========================= */

.back{
    background:#111;

    color:#fff;

    border:0;

    border-radius:10px;

    padding:12px 18px;

    margin-bottom:20px;

    font-weight:700;
}

.panel{
    border:3px solid var(--red);

    border-radius:25px;

    padding:25px;

    background:#fff;
}

.panel h2{
    font-size:34px;

    margin:0 0 10px;
}

.panel h3{
    font-size:24px;

    margin-top:28px;
}

.notice{
    background:var(--grey);

    border-left:6px solid var(--red);

    padding:16px;

    border-radius:12px;

    margin:12px 0;
}

/* =========================
   ANNEES
========================= */

.year{
    border:1px solid var(--border);

    border-radius:15px;

    padding:18px;

    margin:12px 0;
}

.year-title{
    font-size:20px;

    font-weight:700;
}

.year-status{
    display:inline-block;

    margin-top:7px;

    color:#555;

    font-size:14px;
}

.year button{
    margin-top:14px;

    background:#111;

    color:#fff;

    border:0;

    border-radius:9px;

    padding:10px 15px;
}

/* =========================
   DOCUMENTS
========================= */

.document{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    padding:14px 0;

    border-bottom:1px solid #ddd;
}

.action{
    border:0;

    background:var(--red);

    color:#fff;

    border-radius:10px;

    padding:11px 15px;

    font-weight:700;

    margin:5px 3px;
}

.action.black{
    background:#111;
}

input[type=file]{
    max-width:100%;

    margin:10px 0;
}

/* =========================
   GESTION DU COMPTE
========================= */

.admin-box{
    border:1px solid #ccc;

    border-radius:16px;

    padding:20px;

    margin-top:20px;

    background:#fafafa;
}

.admin-select{
    width:100%;

    padding:12px;

    border:1px solid #bbb;

    border-radius:8px;

    background:white;

    margin:10px 0;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    color:#555;

    font-size:12px;

    padding:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .hero{
        min-height:380px;
    }

    .hero h1{
        font-size:53px;
    }

    .tab{
        font-size:17px;
    }

    .card h2{
        font-size:35px;
    }

    .panel{
        padding:18px;
    }

}

</style>
</head>

===================================================== */

function saveDocuments(){

    localStorage.setItem(

        "demoNanterreDocuments",

        JSON.stringify(documents)

    );

}


/* =====================================================
   CHANGEMENT D'ONGLET
===================================================== */

function changeTab(button,tab){

    currentTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(
            element =>
                element.classList
                    .remove("active")
        );

    button.classList.add("active");

    renderCards();

}


/* =====================================================
   AFFICHAGE DES CARTES
===================================================== */

function renderCards(){

    document
        .getElementById("home")
        .classList
        .add("active");

    document
        .getElementById("detail")
        .classList
        .remove("active");

    const list =
        services.filter(
            service =>
                service.tab === currentTab
        );

    document
        .getElementById("cards")
        .innerHTML =

        list.map(
            service => `

                <button
                    class="card"
                    onclick="
                        openService(
                            '${service.id}'
                        )
                    "
                >

                    <div class="icon">

                        ${icons[service.icon]}

                    </div>

                    <h2>
                        ${service.title}
                    </h2>

                    <p>
                        ${service.description}
                    </p>

                </button>

            `
        ).join("");

}


/* =====================================================
   OUVRIR UNE RUBRIQUE
===================================================== */

function openService(id){

    document
        .getElementById("home")
        .classList
        .remove("active");

    document
        .getElementById("detail")
        .classList
        .add("active");


    if(id === "documents"){

        showDocuments();

    }

    else if(id === "gestion"){

        showManagement();

    }

    else{

        showGeneric(id);

    }

    window.scrollTo(0,0);

}


/* =====================================================
   RETOUR
===================================================== */

function goHome(){

    renderCards();

    window.scrollTo(0,0);

}


/* =====================================================
   MES DOCUMENTS
===================================================== */

function showDocuments(){

    document

        .innerHTML = `

}


/* =====================================================
   RESULTATS
===================================================== */

function showResults(id){

    const year =
        years.find(
            item =>
                item.id === id
        );

    const list =
        documents[id] || [];


    document
        .getElementById("content")
        .innerHTML = `

            <h2>

                ${year.title}

            </h2>

            <div class="notice">

                <strong>
                    DOCUMENT FICTIF —
                    DÉMONSTRATION
                </strong>

                <br><br>

                Les résultats présentés
                ici sont fictifs.

            </div>

            <h3>
                Documents associés
            </h3>

            ${

                list.length

                ?

                list.map(
                    doc => `

                        <div class="document">

                            <span>
                                ${escapeHTML(doc)}
                            </span>

                        </div>

                    `
                ).join("")

                :

                `

                    <div class="notice">

                        Aucun document disponible.

                    </div>

                `

            }

            <br>

            <button
                class="back"
                onclick="showDocuments()"
            >

                ← Retour aux relevés

            </button>

        `;

}

                                    value="${year.id}"
                                >

                                    ${year.title}

                                </option>

                            `
                        ).join("")

                    }

                </select>


                <h3>
                    Ajouter un document fictif
                </h3>

                <input
                    id="adminFile"
                    type="file"
                    accept="
                        .pdf,
                        .png,
                        .jpg,
                        .jpeg,
                        .doc,
                        .docx
                    "
                >

                <br>

                <button
                    class="action"
                    onclick="adminAddFile()"
                >

                    Ajouter le document

                </button>

                <button
                    class="action black"
                    onclick="adminAddFictional()"
                >

                    Ajouter un document fictif

                </button>

            </div>


            <div class="admin-box">

                <h3>
                    Documents existants
                </h3>

                <div id="adminDocuments"></div>

            </div>

        `;


    renderAdminDocuments();

}


/* =====================================================
   AFFICHAGE ADMIN
===================================================== */

function renderAdminDocuments(){

    const select =
        document.getElementById(
            "adminYear"
        );

    const container =
        document.getElementById(
            "adminDocuments"
        );


    if(
        !select ||
        !container
    ){

        return;

    }


    const id =
        select.value;


    const list =
        documents[id] || [];


    if(!list.length){

        container.innerHTML = `

            <div class="notice">

                Aucun document fictif.

            </div>

        `;

        return;

    }


    container.innerHTML =

        list.map(
            (doc,index) => `

                <div class="document">

                    <span>

                        ${escapeHTML(doc)}

                    </span>


                    <button
                        class="action black"
                        onclick="
                            adminDeleteDocument(
                                '${id}',
                                ${index}
                            )
                        "
                    >

                        Supprimer

                    </button>

                </div>

            `
        ).join("");

}


/* =====================================================
   AJOUTER UN FICHIER
===================================================== */

function adminAddFile(){

    const select =
        document.getElementById(
            "adminYear"
        );

    const input =
        document.getElementById(
            "adminFile"
        );


    if(
        !select ||
        !input ||
        !input.files.length
    ){

        alert(
            "Sélectionne un fichier."
        );

        return;

    }


    const id =
        select.value;


    if(!documents[id]){

        documents[id] = [];

    }


    documents[id].push(

        input.files[0].name
        +
        " — DOCUMENT FICTIF"

    );


    saveDocuments();


    input.value = "";


    renderAdminDocuments();

}


/* =====================================================
   AJOUTER DOCUMENT FICTIF
===================================================== */

function adminAddFictional(){

    const select =
        document.getElementById(
            "adminYear"
        );


    if(!select){

        return;

    }


    const id =
        select.value;


    const name =
        prompt(
            "Nom du document fictif :"
        );


    if(!name){

        return;

    }


    if(!documents[id]){

        documents[id] = [];

    }


    documents[id].push(

        name
        +
        " — DOCUMENT FICTIF"

    );


    saveDocuments();


    renderAdminDocuments();

}


/* =====================================================
   SUPPRIMER DOCUMENT
===================================================== */

function adminDeleteDocument(
    id,
    index
){

    if(!documents[id]){

        return;

    }


    documents[id].splice(
        index,
        1
    );


    saveDocuments();


    renderAdminDocuments();

}

/* =====================================================
   SECURISATION DE L'AFFICHAGE
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(
            /[&<>"']/g,

            character => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character])

        );

}
